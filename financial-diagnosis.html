    <script src="script.js"></script>
    <script>
        // Financial Diagnosis Logic
        const form = document.getElementById('financialForm');
        const progressFill = document.getElementById('progressFill');

        // Update progress bar
        form.addEventListener('change', () => {
            const totalQuestions = 12;
            const answeredQuestions = form.querySelectorAll('input[type="radio"]:checked').length;
            const progress = (answeredQuestions / totalQuestions) * 100;
            progressFill.style.width = progress + '%';
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            // Get form data
            const formData = new FormData(form);
            const data = {
                monthlyIncome: parseInt(formData.get('monthlyIncome')),
                monthlySavings: parseInt(formData.get('monthlySavings')),
                currentSavings: parseInt(formData.get('currentSavings')),
                investmentExperience: formData.get('investmentExperience'),
                lossReaction: formData.get('lossReaction'),
                maxLoss: parseInt(formData.get('maxLoss')),
                investmentTimeframe: parseInt(formData.get('investmentTimeframe')),
                investmentKnowledge: formData.get('investmentKnowledge'),
                investmentGoal: formData.get('investmentGoal'),
                financialFreedomTimeframe: parseInt(formData.get('financialFreedomTimeframe')),
                passiveIncomeTarget: parseInt(formData.get('passiveIncomeTarget')),
                consumptionChange: formData.get('consumptionChange')
            };

            // Calculate financial type
            const result = calculateFinancialType(data);

            // Store result and redirect
            sessionStorage.setItem('financialResult', JSON.stringify(result));
            window.location.href = 'financial-result.html';
        });

        function calculateFinancialType(data) {
            let score = 0;
            let savingsCapacity = 0;
            let riskTolerance = 0;

            // Calculate savings capacity score
            if (data.monthlySavings >= 15000) savingsCapacity = 3;
            else if (data.monthlySavings >= 7500) savingsCapacity = 2;
            else if (data.monthlySavings >= 2500) savingsCapacity = 1;
            else savingsCapacity = 0;

            // Calculate risk tolerance score
            if (data.maxLoss >= 30) riskTolerance = 3;
            else if (data.maxLoss >= 20) riskTolerance = 2;
            else if (data.maxLoss >= 10) riskTolerance = 1;
            else riskTolerance = 0;

            // Determine financial type
            let financialType = 'confused';
            
            if (savingsCapacity >= 2 && riskTolerance >= 2) {
                financialType = 'aggressive';
            } else if (savingsCapacity >= 1 && riskTolerance >= 1) {
                financialType = 'balanced';
            } else if (savingsCapacity >= 1 || riskTolerance >= 1) {
                financialType = 'conservative';
            } else {
                financialType = 'confused';
            }

            return {
                financialType: financialType,
                savingsCapacity: savingsCapacity,
                riskTolerance: riskTolerance,
                monthlyIncome: data.monthlyIncome,
                monthlySavings: data.monthlySavings,
                currentSavings: data.currentSavings,
                investmentExperience: data.investmentExperience,
                consumptionChange: data.consumptionChange
            };
        }
    </script>

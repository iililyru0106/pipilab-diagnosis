            --bg-card: #F7EBD9;

            --bg-selected: #E8D4B8;
            --text-main: #2D1F0F;
            --text-soft: #5F4631;
            --text-mute: #8B7355;

        * {

            padding: 0;
            box-sizing: border-box;

        body {

        .container {

        .progress-bar {

        }

        .intro {

        .toast {

        .footer-mini {

                .email-screen {

        .email-form {

        .email-input {

        @media (max-width: 380px) {

</head>
<body>

<div class="container">

                <div style="display: flex; flex-direction: column; gap: 12px;">

<script>
const questions = [
    {
        q: "你目前每個月的儲蓄狀況是？",
        options: [
            { text: "幾乎沒辦法存錢", type: "D" },
            { text: "能存 5-10% 收入", type: "A" },
            { text: "能存 10-25% 收入", type: "B" },
            { text: "能存 25% 以上", type: "C" }

            { text: "完全不會想投資，不接受任何虧損", type: "D" },

            { text: "有點難受，但會繼續持有", type: "B" },
            { text: "看狀況，可能反而加碼", type: "C" }
        ]
    },
    {
        q: "你目前對自己的財務「了解」到什麼程度？",
        options: [
            { text: "不太清楚，每個月薪水進來就花掉", type: "D" },
            { text: "知道大概，但沒有詳細追蹤", type: "A" },

            { text: "清楚收支、資產配置、目標", type: "C" }

            { text: "存了一些但不確定夠不夠", type: "B" },
            { text: "有明確數字，正在執行中", type: "C" }

];

const results = {
    A: {
        icon: "🛡",
        name: "保守型",
        tagline: "你想穩，但穩不一定等於安全。",

let currentQuestion = 0;
let answers = [];

function startQuiz() {
    document.getElementById('screenIntro').classList.remove('active');
    document.getElementById('screenQuestion').classList.add('active');
    document.getElementById('progressBar').classList.add('show');
    currentQuestion = 0;
    answers = [];
    renderQuestion();
}

function renderQuestion() {
    const q = questions[currentQuestion];
    document.getElementById('questionNum').textContent = `第 ${currentQuestion + 1} 題 · 共 ${questions.length} 題`;
    document.getElementById('questionText').textContent = q.q;

    const optionsDiv = document.getElementById('options');
    optionsDiv.innerHTML = '';
    const letters = ['A', 'B', 'C', 'D'];

    q.options.forEach((opt, idx) => {
        const div = document.createElement('button');
        div.className = 'option';
        if (answers[currentQuestion] === idx) div.classList.add('selected');
        div.innerHTML = `<span class="option-letter">${letters[idx]}</span><span>${opt.text}</span>`;
        div.onclick = () => selectOption(idx, div);
        optionsDiv.appendChild(div);
    });

    const progress = ((currentQuestion + 1) / questions.length) * 100;
    document.getElementById('progressFill').style.width = progress + '%';

    document.getElementById('btnPrev').style.visibility = currentQuestion > 0 ? 'visible' : 'hidden';

    const btnNext = document.getElementById('btnNext');
    btnNext.disabled = answers[currentQuestion] === undefined;
    btnNext.textContent = currentQuestion === questions.length - 1 ? '看結果' : '下一題';

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function selectOption(idx, el) {
    document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    answers[currentQuestion] = idx;
    document.getElementById('btnNext').disabled = false;
}

function nextQuestion() {
    if (answers[currentQuestion] === undefined) return;

    if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        renderQuestion();
    } else {
        showResult();
    }
}

function prevQuestion() {
    if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
    }
}

function showResult() {
    const count = { A: 0, B: 0, C: 0, D: 0 };
    
    for (let i = 0; i < answers.length; i++) {
        const type = questions[i].options[answers[i]].type;
        count[type]++;
    }

    let resultType = 'D';
    let maxCount = -1;
    
    for (const type in count) {
        if (count[type] > maxCount) {
            maxCount = count[type];
            resultType = type;
        }
    }

    const r = results[resultType];

    document.getElementById('resultIcon').textContent = r.icon;
    document.getElementById('resultName').textContent = r.name;
    document.getElementById('resultTagline').textContent = r.tagline;
    document.getElementById('resultTrait').textContent = r.trait;
    document.getElementById('resultStruggle').textContent = r.struggle;
    document.getElementById('resultPath').innerHTML = r.path;
    document.getElementById('resultQuote').innerHTML = r.quote;

    document.getElementById('screenQuestion').classList.remove('active');
    // Email form moved to result screen
    document.getElementById('progressBar').classList.remove('show');
    document.getElementById('screenResult').classList.add('active');
    
    window.pendingResult = resultType;
    window.currentResultType = resultType;

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function shareResult() {
    const r = results[window.currentResultType];
    const text = `我是「${r.name}」\n${r.tagline}\n\n你呢？來測測看你的財務體質 ↓`;
    const url = window.location.href;

    if (navigator.share) {
        navigator.share({
            title: '財經診斷',
            text: text,
            url: url
        }).catch(() => copyToClipboard(text + '\n' + url));
    } else {
        copyToClipboard(text + '\n' + url);
    }
}

function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => {
        showToast('已複製分享文案，貼到 IG 限動就可以了！');
    }).catch(() => {
        showToast('請手動複製這個網址分享');
    });
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

function retryQuiz() {
    document.getElementById('screenResult').classList.remove('active');
    document.getElementById('screenIntro').classList.add('active');
    currentQuestion = 0;
    answers = [];
    document.getElementById('progressFill').style.width = '0%';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function backToHome() {
    window.location.href = 'index.html';
}

function submitEmail() {
    // Prevent multiple submissions
    if (window.isSubmitting) return;
    window.isSubmitting = true;
    
    const email = document.getElementById('emailInput').value;
    if (!email || !email.includes('@')) {
        showToast('請輸入有效的 Email');
        window.isSubmitting = false;
        return;
    }
    
    // Disable button
    const submitBtn = document.querySelector('.email-form button');
    submitBtn.disabled = true;
    
    // Store email in localStorage
    localStorage.setItem('userEmail', email);
    localStorage.setItem('userEmailTime', new Date().toISOString());
    
    // Get the result type
    const resultType = window.pendingResult;
    const r = results[resultType];
    
    // Show result immediately (don't wait for Google Sheets)
    showResultScreen();
    
    // Submit to Google Sheets in background (fire and forget)
    fetch('https://script.google.com/macros/s/AKfycbwei9Qvo9D6MKlMteg4uh8vxI9LqdwgypmXCwAainzoLIsHwsc27qZtWUo_EFJYKR7s/exec', {
        method: 'POST',
        mode: 'no-cors',
        body: new URLSearchParams({
            email: email,
            quizType: '財經診斷',
            result: r.name
        })
    }).catch(error => console.log('Google Sheets submission:', error));
}

function showResultScreen() {
    const resultType = window.pendingResult;
    const r = results[resultType];

    document.getElementById('resultIcon').textContent = r.icon;
    document.getElementById('resultName').textContent = r.name;
    document.getElementById('resultTagline').textContent = r.tagline;
    document.getElementById('resultTrait').textContent = r.trait;
    document.getElementById('resultStruggle').textContent = r.struggle;
    document.getElementById('resultPath').innerHTML = r.path;
    document.getElementById('resultQuote').innerHTML = r.quote;

    // Email form is now part of result screen
    document.getElementById('screenResult').classList.add('active');
    
    window.currentResultType = resultType;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

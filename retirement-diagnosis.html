    <script src="script.js"></script>
    <script>
        // Retirement Diagnosis Logic
        const form = document.getElementById('retirementForm');
        const progressFill = document.getElementById('progressFill');

        // Update progress bar
        form.addEventListener('change', () => {
            const totalQuestions = 10;
            const answeredQuestions = form.querySelectorAll('input[type="radio"]:checked').length;
            const progress = (answeredQuestions / totalQuestions) * 100;
            progressFill.style.width = progress + '%';
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            // Get form data
            const formData = new FormData(form);
            const data = {
                retirementAge: parseInt(formData.get('retirementAge')),
                retirementBudget: parseInt(formData.get('retirementBudget')),
                lifestyleType: formData.get('lifestyleType'),
                currentAge: parseInt(formData.get('currentAge')),
                annualIncome: parseInt(formData.get('annualIncome')),
                currentSavings: parseInt(formData.get('currentSavings')),
                passiveIncome: parseInt(formData.get('passiveIncome')),
                monthlySavings: parseInt(formData.get('monthlySavings')),
                investmentWillingness: formData.get('investmentWillingness'),
                sideBusiness: formData.get('sideBusiness')
            };

            // Calculate retirement feasibility
            const result = calculateRetirementFeasibility(data);

            // Store result and redirect
            sessionStorage.setItem('retirementResult', JSON.stringify(result));
            window.location.href = 'retirement-result.html';
        });

        function calculateRetirementFeasibility(data) {
            const yearsToRetirement = data.retirementAge - data.currentAge;
            const monthlyBudget = data.retirementBudget;
            const requiredAsset = monthlyBudget * 12 * 20; // Assume 5% withdrawal rate
            const currentAsset = data.currentSavings;
            const assetGap = requiredAsset - currentAsset;
            
            // Calculate with monthly savings and investment returns
            let projectedAsset = currentAsset;
            const monthlyReturn = 0.005; // Assume 0.5% monthly return (6% annual)
            
            if (data.investmentWillingness === 'no') {
                monthlyReturn = 0; // No investment returns
            } else if (data.investmentWillingness === 'low') {
                monthlyReturn = 0.003; // 3.6% annual
            } else if (data.investmentWillingness === 'high') {
                monthlyReturn = 0.008; // 9.6% annual
            }

            for (let i = 0; i < yearsToRetirement * 12; i++) {
                projectedAsset = projectedAsset * (1 + monthlyReturn) + data.monthlySavings;
                projectedAsset += (data.passiveIncome * 12) / 12; // Add passive income
            }

            // Determine feasibility
            let feasibility = 'need-adjustment';
            let feasibilityEmoji = '⚠️';
            
            if (projectedAsset >= requiredAsset) {
                feasibility = 'feasible';
                feasibilityEmoji = '✅';
            } else if (projectedAsset >= requiredAsset * 0.8) {
                feasibility = 'close';
                feasibilityEmoji = '⚠️';
            } else {
                feasibility = 'need-replan';
                feasibilityEmoji = '❌';
            }

            return {
                feasibility: feasibility,
                feasibilityEmoji: feasibilityEmoji,
                retirementAge: data.retirementAge,
                yearsToRetirement: yearsToRetirement,
                requiredAsset: requiredAsset,
                currentAsset: currentAsset,
                projectedAsset: Math.round(projectedAsset),
                assetGap: Math.round(requiredAsset - currentAsset),
                monthlyBudget: monthlyBudget,
                monthlySavings: data.monthlySavings,
                investmentWillingness: data.investmentWillingness,
                sideBusiness: data.sideBusiness,
                passiveIncome: data.passiveIncome
            };
        }
    </script>

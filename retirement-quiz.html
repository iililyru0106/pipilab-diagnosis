<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>退休規劃診斷 - 皮皮的生活設計診斷室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #FDF6EE;
            --bg-card: #F7EBD9;
            --bg-card-hover: #F2E0C8;
            --bg-selected: #E8D4B8;
            --text-main: #2D1F0F;
            --text-soft: #5F4631;
            --text-mute: #8B7355;
            --accent: #C4A882;
            --accent-deep: #8B5A2B;
            --border-soft: rgba(139, 90, 43, 0.15);
            --border-active: rgba(139, 90, 43, 0.5);
            --shadow-soft: rgba(139, 90, 43, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 50px 24px 60px;
            min-height: 100vh;
        }

        .progress-bar {
            height: 3px;
            background: var(--border-soft);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 36px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .progress-bar.show {
            opacity: 1;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-deep);
            border-radius: 999px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .screen {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* === 開場頁 === */
        .intro {
            text-align: center;
            padding: 40px 0 20px;
        }

        .intro-tag {
            display: inline-block;
            font-size: 12px;
            color: var(--accent-deep);
            letter-spacing: 3px;
            margin-bottom: 24px;
            padding: 6px 16px;
            background: var(--bg-card);
            border-radius: 20px;
            font-weight: 500;
        }

        .intro-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 30px;
            font-weight: 500;
            margin-bottom: 18px;
            letter-spacing: 1px;
            line-height: 1.4;
        }

        .intro-subtitle {
            font-size: 15px;
            color: var(--text-soft);
            line-height: 1.9;
            margin-bottom: 8px;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
        }

        .intro-meta {
            font-size: 13px;
            color: var(--text-mute);
            margin: 16px 0 32px;
            letter-spacing: 1px;
        }

        .intro-quote {
            font-family: 'Noto Serif TC', serif;
            font-size: 14px;
            color: var(--text-soft);
            font-style: italic;
            padding: 22px 24px;
            background: var(--bg-card);
            border-radius: 16px;
            margin-bottom: 36px;
            line-height: 1.9;
        }

        /* === 按鈕 === */
        .btn {
            display: inline-block;
            padding: 16px 40px;
            border: none;
            border-radius: 14px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-primary {
            background: var(--accent-deep);
            color: var(--bg-main);
            box-shadow: 0 4px 14px var(--shadow-soft);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 90, 43, 0.18);
        }

        .btn-primary:disabled {
            background: var(--accent);
            cursor: not-allowed;
            opacity: 0.6;
            box-shadow: none;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-soft);
            border: 1px solid var(--border-soft);
            padding: 12px 28px;
            font-size: 14px;
        }

        .btn-secondary:hover {
            background: var(--bg-card);
        }

        /* === 題目頁 === */
        .question-num {
            font-size: 12px;
            color: var(--text-mute);
            letter-spacing: 3px;
            margin-bottom: 14px;
            font-weight: 500;
        }

        .question-text {
            font-family: 'Noto Serif TC', serif;
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 32px;
            line-height: 1.5;
            letter-spacing: 0.3px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }

        .option {
            padding: 18px 22px;
            background: var(--bg-card);
            border: 2px solid transparent;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
            color: var(--text-main);
            line-height: 1.6;
            text-align: left;
            font-family: inherit;
            width: 100%;
            display: flex;
            align-items: flex-start;
        }

        .option:hover {
            background: var(--bg-card-hover);
            transform: translateX(2px);
        }

        .option.selected {
            background: var(--bg-selected);
            border-color: var(--border-active);
        }

        .option-letter {
            display: inline-flex;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--bg-main);
            color: var(--accent-deep);
            font-size: 13px;
            font-weight: 500;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
            flex-shrink: 0;
            margin-top: 2px;
            transition: all 0.2s ease;
        }

        .option.selected .option-letter {
            background: var(--accent-deep);
            color: var(--bg-main);
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        /* === 結果頁 === */
        .result {
            padding: 20px 0;
        }

        .result-tag {
            display: inline-block;
            font-size: 12px;
            color: var(--accent-deep);
            letter-spacing: 3px;
            margin-bottom: 16px;
            padding: 6px 16px;
            background: var(--bg-card);
            border-radius: 20px;
            font-weight: 500;
        }

        .result-icon {
            font-size: 56px;
            margin: 12px 0 20px;
            text-align: center;
        }

        .result-name {
            font-family: 'Noto Serif TC', serif;
            font-size: 36px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .result-tagline {
            font-family: 'Noto Serif TC', serif;
            font-size: 15px;
            color: var(--text-soft);
            font-style: italic;
            text-align: center;
            margin-bottom: 36px;
        }

        .result-section {
            margin-bottom: 32px;
        }

        .result-section-title {
            font-size: 16px;
            color: var(--accent-deep);
            letter-spacing: 1px;
            margin-bottom: 16px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .result-section-content {
            font-size: 16px;
            color: var(--text-main);
            line-height: 1.9;
        }

        .result-quote {
            font-family: 'Noto Serif TC', serif;
            font-size: 18px;
            color: var(--text-soft);
            font-style: italic;
            font-weight: 500;
            padding: 24px 26px;
            background: var(--bg-card);
            border-radius: 16px;
            margin: 32px 0;
            line-height: 1.9;
            text-align: center;
        }

        .result-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 36px;
            align-items: stretch;
        }

        .share-btn {
            padding: 16px;
            background: var(--accent-deep);
            color: var(--bg-main);
            border: none;
            border-radius: 14px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
        }

        .share-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 90, 43, 0.18);
        }

        .retry-btn {
            padding: 14px;
            background: transparent;
            color: var(--text-mute);
            border: 1px solid var(--border-soft);
            border-radius: 14px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .retry-btn:hover {
            background: var(--bg-card);
            color: var(--text-soft);
        }

        .back-btn {
            padding: 14px 28px;
            background: transparent;
            color: var(--text-soft);
            border: 1px solid var(--border-soft);
            border-radius: 14px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .back-btn:hover {
            background: var(--bg-card);
        }

        /* === Toast === */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-main);
            color: var(--bg-main);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 13px;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* === footer === */
        .footer-mini {
            text-align: center;
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid var(--border-soft);
            font-size: 12px;
            color: var(--text-mute);
            letter-spacing: 0.5px;
        }

        .footer-mini a {
            color: var(--accent-deep);
            text-decoration: none;
        }

                .email-screen {
            text-align: center;
            padding: 40px 0 20px;
        }

        .email-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 26px;
            font-weight: 500;
            margin-bottom: 16px;
            letter-spacing: 1px;
            line-height: 1.4;
        }

        .email-subtitle {
            font-size: 15px;
            color: var(--text-soft);
            line-height: 1.9;
            margin-bottom: 24px;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
        }

        .email-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .email-input {
            padding: 14px 18px;
            border: 2px solid var(--border-soft);
            border-radius: 14px;
            font-family: inherit;
            font-size: 15px;
            color: var(--text-main);
            background: var(--bg-card);
            transition: all 0.2s ease;
        }

        .email-input:focus {
            outline: none;
            border-color: var(--border-active);
            background: var(--bg-main);
        }

        .email-input::placeholder {
            color: var(--text-mute);
        }

        @media (max-width: 380px) {
            .container {
                padding: 40px 18px 40px;
            }
            .intro-title {
                font-size: 26px;
            }
            .question-text {
                font-size: 19px;
            }
            .result-name {
                font-size: 26px;
            }
            .option {
                padding: 16px 18px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- 開場 -->
    <div class="screen active" id="screenIntro">
        <div class="intro">
            <div class="intro-tag">皮皮.YANG</div>
            <h1 class="intro-title">你的微退休<br>可行性評估</h1>
            <div class="intro-subtitle">
                10 個問題，看清你的退休準備進度。<br>
                給想在 35 歲前微退休的你。
            </div>
            <div class="intro-meta">10 題　·　約 3 分鐘</div>
            <div class="intro-quote">
                「不是要你更厲害，<br>是讓你慢慢走向自由。」
            </div>
            <button class="btn btn-primary" onclick="startQuiz()">開始診斷</button>
        </div>
    </div>

    <!-- 題目 -->
    <div class="screen" id="screenQuestion">
        <div class="question-num" id="questionNum">第 1 題 · 共 10 題</div>
        <div class="question-text" id="questionText"></div>
        <div class="options" id="options"></div>
        <div class="nav">
            <button class="btn btn-secondary" id="btnPrev" onclick="prevQuestion()" style="visibility: hidden;">上一題</button>
            <button class="btn btn-primary" id="btnNext" onclick="nextQuestion()" disabled>下一題</button>
        </div>
    </div>


    <!-- 結果 -->
    <div class="screen" id="screenResult">
        <div class="result">
            <div style="text-align: center;">
                <div class="result-tag">你的退休準備評估</div>
            </div>
            <div class="result-icon" id="resultIcon"></div>
            <div class="result-name" id="resultName"></div>
            <div class="result-tagline" id="resultTagline"></div>

            <div class="result-section">
                <div class="result-section-title">你的現況</div>
                <div class="result-section-content" id="resultStatus"></div>
            </div>

            <div class="result-section">
                <div class="result-section-title">你需要做的</div>
                <div class="result-section-content" id="resultAction"></div>
            </div>

            <div class="result-section">
                <div class="result-section-title">你的微退休路徑</div>
                <div class="result-section-content" id="resultPath"></div>
            </div>

            <div class="result-quote" id="resultQuote"></div>

            <div class="result-actions">
                <button class="share-btn" onclick="shareResult()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="18" cy="5" r="3"></circle>
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                    分享給朋友也診斷看看
                </button>

                <button class="back-btn" onclick="backToHome()">返回首頁</button>
            </div>


            <div style="margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border-soft);">
                <div style="font-size: 13px; color: var(--text-mute); letter-spacing: 1px; margin-bottom: 16px; text-transform: uppercase;">想往下走</div>
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <a href="#" style="padding: 14px; background: var(--accent-deep); color: var(--bg-main); border: none; border-radius: 14px; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; text-align: center; transition: all 0.25s ease; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 2px 8px rgba(139, 90, 43, 0.2);" onclick="goToResource(event)">
                        <span>🎁</span>
                        <span>領取免費資源</span>
                        <span style="margin-left: auto;">→</span>
                    </a>
                    <a href="https://docs.google.com/forms/d/e/1FAIpQLSfQzYjPFauwctzF3TTLI2uqwbm5AYTyXVvD74pfiJ_cVYrvjA/viewform" target="_blank" style="padding: 14px; background: var(--accent-deep); color: var(--bg-main); border: none; border-radius: 14px; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; text-align: center; transition: all 0.25s ease; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 2px 8px rgba(139, 90, 43, 0.2);">
                        <span>💬</span>
                        <span>預約一對一諮詢</span>
                        <span style="margin-left: auto;">→</span>
                    </a>

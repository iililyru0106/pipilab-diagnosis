                <!-- Question 10 -->

                    <label>10. 你的副業目標是什麼？</label>

    <script src="script.js"></script>
    <script>
        // Side Business Diagnosis Logic
        const form = document.getElementById('sideBusinessForm');
        const progressFill = document.getElementById('progressFill');

        // Update progress bar
        form.addEventListener('change', () => {
            const totalQuestions = 11;
            const answeredQuestions = form.querySelectorAll('input[type="radio"]:checked').length;
            const progress = (answeredQuestions / totalQuestions) * 100;
            progressFill.style.width = progress + '%';
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            // Get form data
            const formData = new FormData(form);
            const data = {
                workingHours: parseInt(formData.get('workingHours')),
                freeTime: parseInt(formData.get('freeTime')),
                sideBusinessStatus: formData.get('sideBusinessStatus'),
                persistence: parseInt(formData.get('persistence')),
                timeManagement: formData.get('timeManagement'),
                busyResponse: formData.get('busyResponse'),
                timeKiller: formData.get('timeKiller'),
                sideBusinessExpectation: formData.get('sideBusinessExpectation'),
                sideBusinessReason: formData.get('sideBusinessReason'),
                sideBusinessGoal: formData.get('sideBusinessGoal'),
                sideBusinessInvestment: formData.get('sideBusinessInvestment')
            };

            // Calculate side business personality
            const result = calculateSideBusinessPersonality(data);

            // Store result and redirect
            sessionStorage.setItem('sideBusinessResult', JSON.stringify(result));
            window.location.href = 'side-business-result.html';
        });

        function calculateSideBusinessPersonality(data) {
            let timeScore = 0;
            let executionScore = 0;

            // Calculate time availability score
            if (data.freeTime >= 15) timeScore = 3;
            else if (data.freeTime >= 10) timeScore = 2;
            else if (data.freeTime >= 5) timeScore = 1;
            else timeScore = 0;

            // Calculate execution score
            const executionFactors = {
                'persistence': data.persistence >= 3 ? 1 : 0,
                'timeManagement': data.timeManagement === 'system' || data.timeManagement === 'plan_stick' ? 1 : 0,
                'busyResponse': data.busyResponse === 'double' || data.busyResponse === 'stick' ? 1 : 0
            };
            executionScore = Object.values(executionFactors).reduce((a, b) => a + b, 0);

            // Determine personality type
            let personalityType = 'confused';
            
            if (data.sideBusinessStatus === 'doing') {
                personalityType = 'doer';
            } else if (timeScore >= 2 && executionScore >= 2) {
                personalityType = 'planner';
            } else if (timeScore < 2 && data.sideBusinessReason === 'freedom') {
                personalityType = 'dreamer';
            } else {
                personalityType = 'confused';
            }

            return {
                personalityType: personalityType,
                timeScore: timeScore,
                executionScore: executionScore,
                freeTime: data.freeTime,
                sideBusinessStatus: data.sideBusinessStatus,
                sideBusinessGoal: data.sideBusinessGoal,
                sideBusinessReason: data.sideBusinessReason
            };
        }
    </script>

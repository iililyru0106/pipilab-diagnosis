<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>副業診斷 - 皮皮的生活設計診斷室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #FDF6EE;
            --bg-card: #F7EBD9;
            --bg-card-hover: #F2E0C8;
            --bg-selected: #E8D4B8;
            --text-main: #2D1F0F;
            --text-soft: #5F4631;
            --text-mute: #8B7355;
            --accent: #C4A882;
            --accent-deep: #8B5A2B;
            --border-soft: rgba(139, 90, 43, 0.15);
            --border-active: rgba(139, 90, 43, 0.5);
            --shadow-soft: rgba(139, 90, 43, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 50px 24px 60px;
            min-height: 100vh;
        }

        .progress-bar {
            height: 3px;
            background: var(--border-soft);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 36px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .progress-bar.show {
            opacity: 1;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-deep);
            border-radius: 999px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .screen {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .intro {
            text-align: center;
            padding: 40px 0 20px;
        }

        .intro-tag {
            display: inline-block;
            font-size: 12px;
            color: var(--accent-deep);
            letter-spacing: 3px;
            margin-bottom: 24px;
            padding: 6px 16px;
            background: var(--bg-card);
            border-radius: 20px;
            font-weight: 500;
        }

        .intro-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 30px;
            font-weight: 500;
            margin-bottom: 18px;
            letter-spacing: 1px;
            line-height: 1.4;
        }

        .intro-subtitle {
            font-size: 15px;
            color: var(--text-soft);
            line-height: 1.9;
            margin-bottom: 8px;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
        }

        .intro-meta {
            font-size: 13px;
            color: var(--text-mute);
            margin: 16px 0 32px;
            letter-spacing: 1px;
        }

        .intro-quote {
            font-family: 'Noto Serif TC', serif;
            font-size: 14px;
            color: var(--text-soft);
            font-style: italic;
            padding: 22px 24px;
            background: var(--bg-card);
            border-radius: 16px;
            margin-bottom: 36px;
            line-height: 1.9;
        }

        .btn {
            display: inline-block;
            padding: 16px 40px;
            border: none;
            border-radius: 14px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-primary {
            background: var(--accent-deep);
            color: var(--bg-main);
            box-shadow: 0 4px 14px var(--shadow-soft);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 90, 43, 0.18);
        }

        .btn-primary:disabled {
            background: var(--accent);
            cursor: not-allowed;
            opacity: 0.6;
            box-shadow: none;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-soft);
            border: 1px solid var(--border-soft);
            padding: 12px 28px;
            font-size: 14px;
        }

        .btn-secondary:hover {
            background: var(--bg-card);
        }

        .question-num {
            font-size: 12px;
            color: var(--text-mute);
            letter-spacing: 3px;
            margin-bottom: 14px;
            font-weight: 500;
        }

        .question-text {
            font-family: 'Noto Serif TC', serif;
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 32px;
            line-height: 1.5;
            letter-spacing: 0.3px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }

        .option {
            padding: 18px 22px;
            background: var(--bg-card);
            border: 2px solid transparent;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
            color: var(--text-main);
            line-height: 1.6;
            text-align: left;
            font-family: inherit;
            width: 100%;
            display: flex;
            align-items: flex-start;
        }

        .option:hover {
            background: var(--bg-card-hover);
            transform: translateX(2px);
        }

        .option.selected {
            background: var(--bg-selected);
            border-color: var(--border-active);
        }

        .option-letter {
            display: inline-flex;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--bg-main);
            color: var(--accent-deep);
            font-size: 13px;
            font-weight: 500;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
            flex-shrink: 0;
            margin-top: 2px;
            transition: all 0.2s ease;
        }

        .option.selected .option-letter {
            background: var(--accent-deep);
            color: var(--bg-main);
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .result {
            padding: 20px 0;
        }

        .result-tag {
            display: inline-block;
            font-size: 12px;
            color: var(--accent-deep);
            letter-spacing: 3px;
            margin-bottom: 16px;
            padding: 6px 16px;
            background: var(--bg-card);
            border-radius: 20px;
            font-weight: 500;
        }

        .result-icon {
            font-size: 56px;
            margin: 12px 0 20px;
            text-align: center;
        }

        .result-name {
            font-family: 'Noto Serif TC', serif;
            font-size: 32px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .result-tagline {
            font-family: 'Noto Serif TC', serif;
            font-size: 15px;
            color: var(--text-soft);
            font-style: italic;
            text-align: center;
            margin-bottom: 36px;
        }

        .result-section {
            margin-bottom: 32px;
        }

        .result-section-title {
            font-size: 12px;
            color: var(--accent-deep);
            letter-spacing: 2px;
            margin-bottom: 12px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .result-section-content {
            font-size: 15px;
            color: var(--text-main);
            line-height: 1.9;
        }

        .result-section-content ol {
            margin-left: 20px;
            margin-top: 8px;
        }

        .result-section-content li {
            margin-bottom: 8px;
        }

        .result-quote {
            font-family: 'Noto Serif TC', serif;
            font-size: 16px;
            color: var(--text-soft);
            font-style: italic;
            padding: 24px 26px;
            background: var(--bg-card);
            border-radius: 16px;
            margin: 32px 0;
            line-height: 1.9;
            text-align: center;
        }

        .result-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 36px;
            align-items: stretch;
        }

        .share-btn {
            padding: 16px;
            background: var(--accent-deep);
            color: var(--bg-main);
            border: none;
            border-radius: 14px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
        }

        .share-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 90, 43, 0.18);
        }

        .retry-btn {
            padding: 14px;
            background: transparent;
            color: var(--text-mute);
            border: 1px solid var(--border-soft);
            border-radius: 14px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .retry-btn:hover {
            background: var(--bg-card);
            color: var(--text-soft);
        }

        .back-btn {
            padding: 14px 28px;
            background: transparent;
            color: var(--text-soft);
            border: 1px solid var(--border-soft);
            border-radius: 14px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .back-btn:hover {
            background: var(--bg-card);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-main);
            color: var(--bg-main);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 13px;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .footer-mini {
            text-align: center;
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid var(--border-soft);
            font-size: 12px;
            color: var(--text-mute);
            letter-spacing: 0.5px;
        }

        .footer-mini a {
            color: var(--accent-deep);
            text-decoration: none;
        }

                .email-screen {
            text-align: center;
            padding: 40px 0 20px;
        }

        .email-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 26px;
            font-weight: 500;
            margin-bottom: 16px;
            letter-spacing: 1px;
            line-height: 1.4;
        }

        .email-subtitle {
            font-size: 15px;
            color: var(--text-soft);
            line-height: 1.9;
            margin-bottom: 24px;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
        }

        .email-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .email-input {
            padding: 14px 18px;
            border: 2px solid var(--border-soft);
            border-radius: 14px;
            font-family: inherit;
            font-size: 15px;
            color: var(--text-main);
            background: var(--bg-card);
            transition: all 0.2s ease;
        }

        .email-input:focus {
            outline: none;
            border-color: var(--border-active);
            background: var(--bg-main);
        }

        .email-input::placeholder {
            color: var(--text-mute);
        }

        @media (max-width: 380px) {
            .container {
                padding: 40px 18px 40px;
            }
            .intro-title {
                font-size: 26px;
            }
            .question-text {
                font-size: 19px;
            }
            .result-name {
                font-size: 26px;
            }
            .option {
                padding: 16px 18px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- 開場 -->
    <div class="screen active" id="screenIntro">
        <div class="intro">
            <div class="intro-tag">皮皮.YANG</div>
            <h1 class="intro-title">你的副業<br>人格測驗</h1>
            <div class="intro-subtitle">
                5 個問題，找出你的副業人格。<br>
                給想靠副業改變生活的你。
            </div>
            <div class="intro-meta">5 題　·　約 2 分鐘</div>
            <div class="intro-quote">
                「不是要你更厲害，<br>是讓你慢慢走向自由。」
            </div>
            <button class="btn btn-primary" onclick="startQuiz()">開始診斷</button>
        </div>
    </div>

    <!-- 題目 -->
    <div class="screen" id="screenQuestion">
        <div class="question-num" id="questionNum">第 1 題 · 共 5 題</div>
        <div class="question-text" id="questionText"></div>
        <div class="options" id="options"></div>
        <div class="nav">
            <button class="btn btn-secondary" id="btnPrev" onclick="prevQuestion()" style="visibility: hidden;">上一題</button>
            <button class="btn btn-primary" id="btnNext" onclick="nextQuestion()" disabled>下一題</button>
        </div>
    </div>

    <!-- Email 登記 -->
    <div class="screen" id="screenEmail">
        <div class="email-screen">
            <h2 class="email-title">獲取你的診斷結果</h2>
            <p class="email-subtitle">
                輸入你的 Email，我們會把診斷結果和免費資源寄給你
            </p>
            <div class="email-form">
                <input type="email" id="emailInput" class="email-input" placeholder="你的 Email" required>
                <button class="btn btn-primary" onclick="submitEmail()">取得結果</button>
            </div>
            <button class="btn btn-secondary" onclick="skipEmail()" style="padding: 12px 28px; font-size: 14px;">跳過，直接看結果</button>
        </div>
    </div>

    <!-- 結果 -->
    <div class="screen" id="screenResult">
        <div class="result">
            <div style="text-align: center;">
                <div class="result-tag">你的副業人格</div>
            </div>
            <div class="result-icon" id="resultIcon"></div>
            <div class="result-name" id="resultName"></div>
            <div class="result-tagline" id="resultTagline"></div>

            <div class="result-section">
                <div class="result-section-title">特質</div>
                <div class="result-section-content" id="resultTrait"></div>
            </div>

            <div class="result-section">
                <div class="result-section-title">會卡在哪</div>
                <div class="result-section-content" id="resultStruggle"></div>
            </div>

            <div class="result-section">
                <div class="result-section-title">下一步</div>
                <div class="result-section-content" id="resultPath"></div>
            </div>

            <div class="result-quote" id="resultQuote"></div>

            <div class="result-actions">
                <button class="share-btn" onclick="shareResult()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="18" cy="5" r="3"></circle>
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                    分享給朋友也診斷看看
                </button>
                <button class="retry-btn" onclick="retryQuiz()">重新診斷</button>
                <button class="back-btn" onclick="backToHome()">返回首頁</button>
            </div>


            <div style="margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border-soft);">
                <div style="font-size: 13px; color: var(--text-mute); letter-spacing: 1px; margin-bottom: 16px; text-transform: uppercase;">想往下走</div>
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <a href="#" style="padding: 14px; background: var(--bg-card); color: var(--text-soft); border: none; border-radius: 14px; font-family: inherit; font-size: 14px; cursor: pointer; text-decoration: none; text-align: center; transition: all 0.25s ease; display: flex; align-items: center; justify-content: center; gap: 8px;" onclick="goToResource(event)">
                        <span>🎁</span>
                        <span>領取免費資源</span>
                        <span style="margin-left: auto;">→</span>
                    </a>
                    <a href="https://docs.google.com/forms/d/e/1FAIpQLSfQzYjPFauwctzF3TTLI2uqwbm5AYTyXVvD74pfiJ_cVYrvjA/viewform" target="_blank" style="padding: 14px; background: var(--bg-card); color: var(--text-soft); border: none; border-radius: 14px; font-family: inherit; font-size: 14px; cursor: pointer; text-decoration: none; text-align: center; transition: all 0.25s ease; display: flex; align-items: center; justify-content: center; gap: 8px;">
                        <span>💬</span>
                        <span>預約一對一諮詢</span>
                        <span style="margin-left: auto;">→</span>
                    </a>
                </div>
            </div>

            <div class="footer-mini">
                診斷來自 <a href="https://instagram.com/pipilab.co" target="_blank">@pipilab.co</a> · 皮皮.Yang
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const questions = [
    {
        q: "下班後你最常做的是？",
        options: [
            { text: "滑手機放空，想到副業就累", type: "D" },
            { text: "有想法但常常停在「想」", type: "A" },
            { text: "已經在做一些事，邊做邊調整", type: "B" },
            { text: "探索很多不同方向，看哪個適合", type: "C" }
        ]
    },
    {
        q: "對「副業」這件事，你的態度是？",
        options: [
            { text: "想要有計畫再開始，不然容易半途而廢", type: "A" },
            { text: "邊做邊修正，不用想太多", type: "B" },
            { text: "想試很多種，找到最有興趣的", type: "C" },
            { text: "有想做但時間不夠、動力不足", type: "D" }
        ]
    },
    {
        q: "當你想開始一件副業時，最常卡住的是？",
        options: [
            { text: "一直在收集資料、規劃，沒有真的動手", type: "A" },
            { text: "做了很多但沒方向感，累積不起來", type: "B" },
            { text: "想嘗試的太多，選不出第一個", type: "C" },
            { text: "永遠在「等對的時機」", type: "D" }
        ]
    },
    {
        q: "你願意每週花多少時間在副業？",
        options: [
            { text: "5 小時以內（先排好時段）", type: "A" },
            { text: "5-10 小時（碎片時間都用上）", type: "B" },
            { text: "看心情，有興趣就多做", type: "C" },
            { text: "不確定，看狀況", type: "D" }
        ]
    },
    {
        q: "你做副業最主要的目的是？",
        options: [
            { text: "為了長期累積、達到財務目標", type: "A" },
            { text: "為了找到工作之外的可能性", type: "B" },
            { text: "為了找到真正喜歡做的事", type: "C" },
            { text: "不確定，想要先有就好", type: "D" }
        ]
    }
];

const results = {
    A: {
        icon: "🗂",
        name: "規劃型副業人",
        tagline: "你不靠運氣，你靠計畫。",
        trait: "你習慣把混亂變成清單，把焦慮變成行動。對你來說「準備」本身就是一種安心——只要計畫做好了，焦慮就少了一半。你的優勢是執行力穩、不容易半途而廢，缺點是有時候會卡在「再多準備一點」的迴圈裡。",
        struggle: "你最容易卡在「等準備好再開始」這件事上。但事實是，準備永遠不會完美。副業不是等到 100 分才出發，是 70 分就先做、邊做邊調整。",
        path: "<ol><li>設定一個 3 個月的最小可行目標（例如：3 個月內完成第一個產出）</li><li>砍掉所有「準備中」但沒進度的項目</li><li>每週固定 2 個時段執行，不要等有空才做</li></ol>",
        quote: "你的計畫已經夠了。<br>該開始的，是按下執行的那個鍵。"
    },
    B: {
        icon: "🚀",
        name: "行動型副業人",
        tagline: "你不等完美，你先出發。",
        trait: "你不喜歡空想，喜歡先做做看。對你來說「做了再說」比「想到完美」更重要。你的優勢是執行速度快、容易累積成果，缺點是有時候沒方向感，會走了一段才發現方向不對。",
        struggle: "你最容易卡在「累積但沒有複利」的循環裡。你做了很多事，但每件事都是獨立的，沒有變成一個更大的東西。副業需要的不只是「做」，是「朝同一個方向做」。",
        path: "<ol><li>盤點過去 3 個月做過的所有副業相關事項</li><li>找出哪些「會累積」、哪些「只是花時間」</li><li>砍掉後者，把資源集中在前者</li></ol>",
        quote: "你已經很會走了。<br>現在需要的，是確認方向。"
    },
    C: {
        icon: "🌿",
        name: "探索型副業人",
        tagline: "你不急著定型，你保持開放。",

        struggle: "你最容易卡在「想嘗試的事太多、決定不了哪個」的猶豫裡。副業準備不需要你選擇全部，需要你選擇「現在這一年」要專心走哪一條。其他可能性可以放著，但這一年要有重心。",
        path: "<ol><li>列出你目前在考慮的所有方向</li><li>給自己一個「1 年實驗期」，挑最有感覺的那條全力試</li><li>1 年後不對勁再換</li></ol>",

        name: "醞釀型副業人",
        tagline: "你不是慢，你是還沒出發。",

        quote: "你不需要從大事開始。<br>你需要的，只是先動一下。"

};

let currentQuestion = 0;
let answers = [];

function startQuiz() {
    document.getElementById('screenIntro').classList.remove('active');
    document.getElementById('screenQuestion').classList.add('active');
    document.getElementById('progressBar').classList.add('show');
    currentQuestion = 0;
    answers = [];
    renderQuestion();
}

function renderQuestion() {
    const q = questions[currentQuestion];
    document.getElementById('questionNum').textContent = `第 ${currentQuestion + 1} 題 · 共 ${questions.length} 題`;
    document.getElementById('questionText').textContent = q.q;

    const optionsDiv = document.getElementById('options');
    optionsDiv.innerHTML = '';
    const letters = ['A', 'B', 'C', 'D'];

    q.options.forEach((opt, idx) => {
        const div = document.createElement('button');
        div.className = 'option';
        if (answers[currentQuestion] === idx) div.classList.add('selected');
        div.innerHTML = `<span class="option-letter">${letters[idx]}</span><span>${opt.text}</span>`;
        div.onclick = () => selectOption(idx, div);
        optionsDiv.appendChild(div);
    });

    const progress = ((currentQuestion + 1) / questions.length) * 100;
    document.getElementById('progressFill').style.width = progress + '%';

    document.getElementById('btnPrev').style.visibility = currentQuestion > 0 ? 'visible' : 'hidden';

    const btnNext = document.getElementById('btnNext');
    btnNext.disabled = answers[currentQuestion] === undefined;
    btnNext.textContent = currentQuestion === questions.length - 1 ? '看結果' : '下一題';

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function selectOption(idx, el) {
    document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    answers[currentQuestion] = idx;
    document.getElementById('btnNext').disabled = false;
}

function nextQuestion() {
    if (answers[currentQuestion] === undefined) return;

    if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        renderQuestion();
    } else {
        showResult();
    }
}

function prevQuestion() {
    if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
    }
}

function showResult() {
    const count = { A: 0, B: 0, C: 0, D: 0 };
    
    for (let i = 0; i < answers.length; i++) {
        const type = questions[i].options[answers[i]].type;
        count[type]++;
    }

    let resultType = 'D';
    let maxCount = -1;
    
    for (const type in count) {
        if (count[type] > maxCount) {
            maxCount = count[type];
            resultType = type;
        }
    }

    const r = results[resultType];

    document.getElementById('resultIcon').textContent = r.icon;
    document.getElementById('resultName').textContent = r.name;
    document.getElementById('resultTagline').textContent = r.tagline;
    document.getElementById('resultTrait').textContent = r.trait;
    document.getElementById('resultStruggle').textContent = r.struggle;
    document.getElementById('resultPath').innerHTML = r.path;
    document.getElementById('resultQuote').innerHTML = r.quote;

    document.getElementById('screenQuestion').classList.remove('active');
    document.getElementById('screenEmail').classList.add('active');
    document.getElementById('progressBar').classList.remove('show');
    
    window.pendingResult = resultType;

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function shareResult() {
    const r = results[window.currentResultType];
    const text = `我是「${r.name}」\n${r.tagline}\n\n你呢？來測測看你的副業人格 ↓`;
    const url = window.location.href;

    if (navigator.share) {
        navigator.share({
            title: '副業人格測驗',
            text: text,
            url: url
        }).catch(() => copyToClipboard(text + '\n' + url));
    } else {
        copyToClipboard(text + '\n' + url);
    }
}

function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => {
        showToast('已複製分享文案，貼到 IG 限動就可以了！');
    }).catch(() => {
        showToast('請手動複製這個網址分享');
    });
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

function retryQuiz() {
    document.getElementById('screenResult').classList.remove('active');
    document.getElementById('screenIntro').classList.add('active');
    currentQuestion = 0;
    answers = [];
    document.getElementById('progressFill').style.width = '0%';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function backToHome() {
    window.location.href = 'index.html';
}

function submitEmail() {
    const email = document.getElementById('emailInput').value;
    if (!email || !email.includes('@')) {
        showToast('請輸入有效的 Email');
        return;
    }
    showResultScreen();
}

function skipEmail() {
    showResultScreen();
}

function showResultScreen() {
    const resultType = window.pendingResult;
    const r = results[resultType];

    document.getElementById('resultIcon').textContent = r.icon;
    document.getElementById('resultName').textContent = r.name;
    document.getElementById('resultTagline').textContent = r.tagline;
    document.getElementById('resultTrait').textContent = r.trait;
    document.getElementById('resultStruggle').textContent = r.struggle;
    document.getElementById('resultPath').innerHTML = r.path;
    document.getElementById('resultQuote').innerHTML = r.quote;

    document.getElementById('screenEmail').classList.remove('active');
    document.getElementById('screenResult').classList.add('active');
    
    window.currentResultType = resultType;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goToResource(e) {
    e.preventDefault();
    showToast('免費資源連結即將推出，敬請期待！');
}

</script>
